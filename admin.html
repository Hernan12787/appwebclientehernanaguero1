<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Refresco Bebida Argentina</title>
  <link rel="icon" type="image/x-icon" href="refresco.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="admin">
      <h2>Administración de productos</h2>
      
      <div class="admin-grid">
        <form id="admin-form" class="admin-card">
          <h3>Producto</h3>
          <div>
            <label for="admin-id">ID (automático)</label>
            <input type="number" id="admin-id" placeholder="Automático" readonly />
          </div>
          <div>
            <label for="admin-nombre">Nombre</label>
            <input type="text" id="admin-nombre" placeholder="Nombre del producto" />
          </div>
          <div>
            <label for="admin-precio">Precio</label>
            <input type="number" id="admin-precio" step="any" placeholder="Precio" />
          </div>
          <div>
            <label for="admin-url">URL de imagen</label>
            <input type="text" id="admin-url" placeholder="https://..." />
          </div>
          <div class="admin-form-acciones">
            <button type="submit" id="admin-guardar">Guardar</button>
            <button type="button" id="admin-nuevo" class="admin-btn-secundario">Nuevo</button>
          </div>
          <p id="admin-estado" class="admin-estado" role="status" aria-live="polite"></p>
        </form>

        <div class="admin-card admin-lista-card">
          <div class="admin-lista-header">
            <h3>Productos cargados</h3>
          </div>
          <div id="admin-lista" class="admin-lista"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="archivo.js"></script>
  <script src="producto.js"></script>
  <script src="admin.js"></script>
</body>
</html>
